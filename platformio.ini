[platformio]
src_dir = src
boards_dir = boards

[env]
platform = ststm32
framework = arduino

monitor_speed = 576000

lib_deps =
  # SimpleFOC
  ; askuric/Simple FOC@^2.3.2
  # Might have interesting drivers for SimpleFOC
  ; simplefoc/SimpleFOCDrivers@^1.0.6
  ; lib/tools/bootloader
  migration

build_unflags = 

build_flags = 
  -Isrc

build_src_filter =
  +<*>
  -<target/>
  -<lib/>
  # version control
  -<.git/>
  -<.svn/>

