[env:cln17_v3_release]
build_type = debug
board = genericSTM32G431CB

; 128 KiB physical Flash - 16 KiB persistent NVM = 112 KiB firmware
board_upload.maximum_size = 114688

upload_protocol = stlink
debug_tool = stlink

build_flags =
  ${env.build_flags}
  -Isrc/target/cln17_v3

  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D USBCON

  -save-temps
  -fverbose-asm
  -O0

  -D HAL_TIM_MODULE_ONLY
  -D HAL_ADC_MODULE_ONLY
  -D HAL_EXTI_MODULE_DISABLED
  -D HAL_DAC_MODULE_ENABLED
  -D HAL_CORDIC_MODULE_ENABLED
  -D HAL_FDCAN_MODULE_ENABLED
  -D HAL_Module_Enabled

  -DHSE_VALUE=12000000U
  -DSYSCLK_FREQ_170MHz=170000000U
  -D TARGET_CLN17V3
  -D ARM_MATH_CM4
  -D __FPU_PRESENT=1

  ; Persistent Flash layout
  -D CLN_NVM_ENABLE=1

  
build_src_filter = 
  ${env.build_src_filter}
  +<target/cln17_v3>

lib_ldf_mode = deep+
lib_compat_mode = strict


