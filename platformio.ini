[env:cln17_v2_0_release]
build_type = debug
board = genericSTM32G431CB
upload_protocol = stlink

build_flags = 
  ${env.build_flags}
  -Isrc/target/cln17_v2_0
  ; -Isrc/lib/tools
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC ; Enable USB
  -D USBCON                           ; Enable SerialUSB
  -save-temps
  -fverbose-asm
  -O0
  -D HAL_TIM_MODULE_ONLY              ; Disable stm32duino hardwaretimer
  -D HAL_ADC_MODULE_ONLY              ; Disable stm32duino ADC
  -D HAL_EXTI_MODULE_DISABLED         ; Disable stm32duino interrupts

build_src_filter = 
  ${env.build_src_filter}
  +<target/cln17_v2_0>
  ; +<lib/tools>
  ; +<lib/tools/bootloader>

debug_tool = stlink

[env:radix_release]
build_type = debug
board = genericSTM32G431CB
upload_protocol = stlink

build_flags = 
  ${env.build_flags}
  -Isrc/target/radix
  ; -Isrc/lib/tools
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC ; Enable USB
  -D USBCON                           ; Enable SerialUSB
  -save-temps
  -fverbose-asm
  -O0
  -D HAL_TIM_MODULE_ONLY              ; Disable stm32duino hardwaretimer
  -D HAL_ADC_MODULE_ONLY              ; Disable stm32duino ADC
  -D HAL_EXTI_MODULE_DISABLED         ; Disable stm32duino interrupts
  -DHAL_Module_Enabled
  -DHSE_VALUE=12000000U
  -DSYSCLK_FREQ_170MHz=170000000U
  -D TARGET_RADIX                     ; Target identifier

build_src_filter = 
  ${env.build_src_filter}
  +<target/radix>
  ; +<lib/tools>
  ; +<lib/tools/bootloader>

debug_tool = stlink

[env:cln17_v3_release]
build_type = debug
board = genericSTM32G431CB
upload_protocol = stlink

build_flags = 
  ${env.build_flags}
  -Isrc/target/cln17_v3
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC ; Enable USB
  -D USBCON                           ; Enable SerialUSB
  -save-temps
  -fverbose-asm
  -O0
  -D HAL_TIM_MODULE_ONLY              ; Disable stm32duino hardwaretimer
  -D HAL_ADC_MODULE_ONLY              ; Disable stm32duino ADC
  -D HAL_EXTI_MODULE_DISABLED         ; Disable stm32duino interrupts
  -D HAL_DAC_MODULE_ENABLED           ; Enable DAC module for comparator thresholds
  ; ADC module enabled for Arduino analogRead()
  -DHAL_Module_Enabled
  -DHSE_VALUE=12000000U
  -DSYSCLK_FREQ_170MHz=170000000U
  -D TARGET_CLN17V3                   ; Target identifier

build_src_filter = 
  ${env.build_src_filter}
  +<target/cln17_v3>

debug_tool = stlink

