[platformio]
src_dir = src
boards_dir = boards

; Shared SCons build cache (objects, archives, firmware images). Derived files
; hit this cache before recompiling, so rebuilding an environment after a
; switch (cln17 <-> cln234), after `pio run -t clean`, or after the build_dir
; was wiped reuses unchanged compilation results instead of rebuilding them.
; Real-world effect: a clean build of the second environment compiles only the
; sources whose flags actually differ between the boards.
build_cache_dir = ${platformio.workspace_dir}/build_cache

[env]
platform = ststm32
framework = arduino

monitor_speed = 576000

; Timestamp every received line. Baud is meaningless on a USB CDC port, but
; the timestamps are: a healthy control loop prints one heartbeat per second,
; so any gap wider than that pinpoints a stall in the firmware.
monitor_filters = time

build_unflags = 

build_flags = 
  -Isrc

build_src_filter =
  +<*>
  -<bsp/boards/>
  -<target/>
  -<core/>
  # version control
  -<.git/>
  -<.svn/>

; Developer variant of cln17_v3_release: the same -Os code plus debug symbols
; and the USB CDC console (boot banner, 1 Hz heartbeat, calibration and
; protection diagnostics through the TP_LOG macros). The console costs ~11 KiB
; of flash, which is why the release image leaves it out; the CDC endpoint still
; carries TPCP there. Use this environment with pio debug.
[env:cln17_v3_dev]
extends = env:cln17_v3_release
; Debug build type for pio debug. It strips every -O* / -g* flag from build_flags
; and the framework defaults and injects debug_build_flags (default -Og -g2 -ggdb2),
; so the level is pinned here: same -Os code as the release image plus full DWARF
; (debug info costs no flash). -O2 / -O3 overflow the budget.
build_type = debug
debug_build_flags = -Os -g2 -ggdb2
build_flags =
  ${env:cln17_v3_release.build_flags}
  -D DEV_LOG_ENABLE=1
  ; Control-rate black box (core/flight_recorder.h, protocol register 0x44):
  ; 512 passes x 24 B = 12 KiB of RAM, frozen shortly after a fault.
  -D TP_TRACE_DEPTH=512

; Bench variant of cln17_v3_release for bringing the CAN protocol up on a desk.
; Differs from the release build in its default node configuration - which a
; node that has already saved a configuration ignores - and in keeping the
; console (the heartbeat's "done=" count is how the loopback is verified).
;
;   - node address 1 out of the box, so the drive is reachable without first
;     running a discovery sweep
;   - classic CAN 2.0A at 500 kbit/s, which is what cheap USB-CAN adapters speak
;   - TP_BENCH_LOOPBACK: the controller receives its own frames and needs no
;     second node. Remove this flag as soon as a real adapter is on the bus -
;     a node in loopback is invisible to everything else.
[env:cln17_v3_bench]
extends = env:cln17_v3_release
build_flags =
  ${env:cln17_v3_release.build_flags}
  -D DEV_LOG_ENABLE=1
  -D TP_DEFAULT_NODE_ID=1
  -D TP_DEFAULT_BUS_TYPE=0
  -D TP_DEFAULT_ARB_KBPS=500
  -D TP_BENCH_LOOPBACK=1

; Host-side conformance tests for the CAN protocol wire format. Builds nothing
; from the firmware tree: tp_wire.h / tp_chunks.h are hardware-independent by
; design, which is what makes the wire format testable without a board.
;
;   pio test -e native_tpcp
;
; test_filter keeps this env away from test/test_native/, which still includes
; the pre-refactor lib/ tree and does not compile (see CLAUDE.md).
[env:native_tpcp]
platform = native
framework =
test_filter = test_tpcp
build_flags = -std=c++17 -Wall -Wextra
build_src_filter =

[env:cln17_v3_release]
build_type = release
; Release build type: the framework's default -Os applies and nothing strips it.
; (build_type = debug would discard every -O flag and inject -Og.) No debug
; symbols: the environment for pio debug and the USB console is cln17_v3_dev.
board = cln17_v3

; 128 KiB physical Flash - 16 KiB persistent NVM = 112 KiB firmware
board_upload.maximum_size = 114688

upload_protocol = stlink
debug_tool = stlink

build_flags =
  ${env.build_flags}
  -Isrc/bsp/boards/cln17_v3

  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC   ; the framework script adds USBCON and USBD_USE_CDC itself
  ; CDC TX queue: 64-byte FS packets x this count. The framework default of 2
  ; gives a 128-byte queue, which a single long TP_LOG_VALS label fills on its
  ; own - the values behind it are then always dropped and diagnostic lines
  ; arrive truncated. Every console line is gated on free room (dev_log.h) and
  ; dropped otherwise. 16 packets = 1 KiB, enough for a full warning line;
  ; costs 896 B of RAM over the default.
  -D CDC_TRANSMIT_QUEUE_BUFFER_PACKET_NUMBER=16

  ; -save-temps / -fverbose-asm are intentionally omitted here: they break the
  ; Windows host toolchain (temporary files collide), see the BSP-branch build fix.

  ; sqrtf() / lrintf() as single FPU instructions (vsqrt / vcvtr) instead of the
  ; libm wrappers that set errno on domain errors; nothing in src/ reads errno.
  -fno-math-errno
  ; Link-time optimisation across the firmware TU, the HAL and the USB stack:
  ; ~3 KiB at -Os. Anything referenced only from inline asm needs
  ; __attribute__((used)) (nvm_flash.h: flashg4_ll_nmi_dispatch) or LTO drops it.
  ; =auto: parallel LTRANS jobs; plain -flto warns about serial compilation.
  -flto=auto

  -D HAL_TIM_MODULE_ONLY
  -D HAL_ADC_MODULE_ONLY
  ; No HardwareSerial: the console is USB CDC and nothing opens a UART, yet the
  ; core's serialEventRun() would otherwise construct SerialLP1 and keep HAL UART,
  ; uart.c and HardwareSerial linked - about 5.5 KiB of flash and 380 B of RAM
  ; for a port that never runs. The HAL driver itself still compiles (_ONLY).
  -D HAL_UART_MODULE_ONLY
  -D HAL_EXTI_MODULE_DISABLED
  ; Empty value, matching variant_generic.h: -D FOO would define it as 1 and
  ; every translation unit would warn that the variant redefines it.
  -D HAL_DAC_MODULE_ENABLED=
  -D HAL_CORDIC_MODULE_ENABLED
  -D HAL_FDCAN_MODULE_ENABLED

  -DHSE_VALUE=12000000U
  -DSYSCLK_FREQ_170MHz=170000000U
  -D TARGET_CLN17V3

  ; Composite USB device: CDC console (interfaces 0/1) + vendor HID control
  ; pipe (interface 2). The USB core validates interface-recipient control
  ; requests against this bound, so it must cover the highest interface number.
  -D USBD_MAX_NUM_INTERFACES=3

  ; Persistent Flash layout
  -D CLN_NVM_ENABLE=1

  ; Crc::Stream (the calibration table record) runs on the STM32G4 CRC unit
  ; (bsp/stm32g4/crc.h); the one-shot CRCs stay in software. Drop the flag to
  ; shift everything in software - the stored records are bit-identical either way.
  -D TP_CRC_HW=1

  
build_src_filter = 
  ${env.build_src_filter}
  +<bsp/boards/cln17_v3>

lib_ldf_mode = deep+
lib_compat_mode = strict


[env:cln234_release]
build_type = release
; Release build type: the framework's default -Os applies and nothing strips it.
; (build_type = debug would discard every -O flag and inject -Og.) No debug
; symbols: the environment for pio debug and the USB console is cln17_v3_dev.
board = cln234

upload_protocol = stlink
debug_tool = stlink

build_flags =
  ${env.build_flags}
  -Isrc/bsp/boards/cln234

  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC   ; the framework script adds USBCON and USBD_USE_CDC itself


  ; sqrtf() / lrintf() as single FPU instructions (vsqrt / vcvtr) instead of the
  ; libm wrappers that set errno on domain errors; nothing in src/ reads errno.
  -fno-math-errno
  ; Link-time optimisation across the firmware TU, the HAL and the USB stack:
  ; ~3 KiB at -Os. Anything referenced only from inline asm needs
  ; __attribute__((used)) (nvm_flash.h: flashg4_ll_nmi_dispatch) or LTO drops it.
  ; =auto: parallel LTRANS jobs; plain -flto warns about serial compilation.
  -flto=auto

  -D HAL_TIM_MODULE_ONLY
  -D HAL_ADC_MODULE_ONLY
  ; No HardwareSerial: the console is USB CDC and nothing opens a UART, yet the
  ; core's serialEventRun() would otherwise construct SerialLP1 and keep HAL UART,
  ; uart.c and HardwareSerial linked - about 5.5 KiB of flash and 380 B of RAM
  ; for a port that never runs. The HAL driver itself still compiles (_ONLY).
  -D HAL_UART_MODULE_ONLY
  -D HAL_EXTI_MODULE_DISABLED
  ; Empty value, matching variant_generic.h: -D FOO would define it as 1 and
  ; every translation unit would warn that the variant redefines it.
  -D HAL_DAC_MODULE_ENABLED=
  -D HAL_CORDIC_MODULE_ENABLED
  -D HAL_FDCAN_MODULE_ENABLED

  -DSYSCLK_FREQ_170MHz=170000000U
  -D TARGET_CLN234

  ; Calibration table CRC on the STM32G4 CRC unit (see cln17_v3_release).
  -D TP_CRC_HW=1

build_src_filter =
  ${env.build_src_filter}
  +<bsp/boards/cln234>

lib_ldf_mode = deep+
lib_compat_mode = strict